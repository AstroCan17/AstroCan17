<section class="pipeline-scroll-container" id="pipeline-journey" aria-label="Satellite data pipeline journey">
  <div class="pipeline-hero" id="pipeline-hero" data-baseurl="{{ site.baseurl }}">
    <canvas id="pipeline-canvas" aria-hidden="true"></canvas>
    <div class="pipeline-fallback" aria-hidden="true">
      <svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Satellite to ground processing pipeline">
        <defs>
          <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#58a6ff"/>
            <stop offset="100%" style="stop-color:#238636"/>
          </linearGradient>
        </defs>
        <rect width="800" height="200" fill="#0a0e1a"/>
        <g fill="#8b949e" font-size="11" font-family="system-ui,sans-serif">
          <circle cx="60" cy="100" r="3" fill="#fff" opacity="0.6"/>
          <circle cx="90" cy="70" r="2" fill="#fff" opacity="0.4"/>
          <circle cx="120" cy="130" r="2" fill="#fff" opacity="0.5"/>
          <text x="180" y="105" fill="#e6edf3">Satellite</text>
          <text x="320" y="105" fill="#e6edf3">Downlink</text>
          <text x="460" y="105" fill="#e6edf3">Ground station</text>
          <text x="580" y="105" fill="#e6edf3">Processing</text>
          <text x="700" y="105" fill="#e6edf3">L1/L2 products</text>
        </g>
        <rect x="150" y="85" width="40" height="30" rx="4" fill="#30363d" stroke="#58a6ff"/>
        <path d="M200 100 L280 100" stroke="url(#pipeGrad)" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M280 100 Q300 60 320 100" stroke="#58a6ff" stroke-width="2" fill="none" opacity="0.7"/>
        <polygon points="0,0 6,3 0,6" fill="#58a6ff" id="arrow"/>
        <path d="M350 100 L430 100" stroke="url(#pipeGrad)" stroke-width="2"/>
        <path d="M450 75 L450 125 L480 100 Z" fill="#9e6a03"/>
        <rect x="500" y="75" width="50" height="50" rx="4" fill="#161b22" stroke="#30363d"/>
        <rect x="510" y="85" width="8" height="30" fill="#238636" opacity="0.8"/>
        <rect x="522" y="85" width="8" height="30" fill="#238636" opacity="0.6"/>
        <rect x="534" y="85" width="8" height="30" fill="#238636" opacity="0.4"/>
        <path d="M560 100 L640 100" stroke="url(#pipeGrad)" stroke-width="2"/>
        <rect x="660" y="80" width="60" height="40" rx="4" fill="#1f6feb" opacity="0.3" stroke="#58a6ff"/>
        <line x1="200" y1="100" x2="750" y2="100" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
      </svg>
    </div>
    <p class="pipeline-stage-label" id="pipeline-stage-label">Scroll to begin the journey</p>
  </div>
  <div class="pipeline-scroll-spacer" id="pipeline-scroll-spacer"></div>
</section>
