<section class="pipeline-scroll-container" id="pipeline-journey" aria-label="Satellite data pipeline journey">
  <div class="pipeline-hero" id="pipeline-hero">
    <canvas id="pipeline-canvas" aria-hidden="true"></canvas>
    <div class="pipeline-vignette" aria-hidden="true"></div>
    <div class="pipeline-ui">
      <div class="pipeline-progress" id="pipeline-progress" aria-hidden="true">
        <span class="pipeline-dot active" data-stage="0"></span>
        <span class="pipeline-dot" data-stage="1"></span>
        <span class="pipeline-dot" data-stage="2"></span>
        <span class="pipeline-dot" data-stage="3"></span>
        <span class="pipeline-dot" data-stage="4"></span>
        <span class="pipeline-dot" data-stage="5"></span>
      </div>
      <div class="pipeline-stage-card" id="pipeline-stage-card">
        <span class="pipeline-stage-num" id="pipeline-stage-num">01</span>
        <p class="pipeline-stage-title" id="pipeline-stage-title">Deep space</p>
        <p class="pipeline-stage-desc" id="pipeline-stage-desc">Starfield and Earth limb — the observation chain begins in orbit.</p>
      </div>
      <p class="pipeline-scroll-cue" id="pipeline-scroll-cue">Scroll to fly through the pipeline</p>
    </div>
    <div class="pipeline-fallback" aria-hidden="true">
      <svg class="pipeline-fallback-svg" viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Satellite to ground processing pipeline">
        <defs>
          <linearGradient id="pf-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#050810"/>
            <stop offset="100%" stop-color="#0d1117"/>
          </linearGradient>
          <linearGradient id="pf-beam" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#238636" stop-opacity="0.7"/>
          </linearGradient>
          <filter id="pf-glow">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect width="960" height="240" fill="url(#pf-sky)"/>
        <g opacity="0.7">
          <circle cx="40" cy="30" r="1" fill="#fff"/><circle cx="120" cy="60" r="1.2" fill="#fff"/>
          <circle cx="200" cy="25" r="0.8" fill="#fff"/><circle cx="880" cy="40" r="1" fill="#fff"/>
          <circle cx="800" cy="80" r="0.9" fill="#fff"/><circle cx="700" cy="20" r="1.1" fill="#fff"/>
        </g>
        <ellipse cx="120" cy="200" rx="90" ry="28" fill="#1a4d7a" opacity="0.5"/>
        <g transform="translate(200,95)">
          <rect x="-18" y="-8" width="36" height="16" rx="2" fill="#484f58"/>
          <rect x="-42" y="-3" width="22" height="6" rx="1" fill="#1f6feb" opacity="0.9"/>
          <rect x="20" y="-3" width="22" height="6" rx="1" fill="#1f6feb" opacity="0.9"/>
        </g>
        <path d="M250 100 Q400 40 520 120" stroke="url(#pf-beam)" stroke-width="3" fill="none" filter="url(#pf-glow)" opacity="0.85"/>
        <g transform="translate(540,130)">
          <path d="M0,-35 A35,35 0 0,1 35,0 L0,0 Z" fill="#9e6a03" opacity="0.85"/>
          <rect x="-4" y="0" width="8" height="30" fill="#484f58"/>
        </g>
        <g transform="translate(660,100)">
          <rect x="0" y="0" width="70" height="55" rx="4" fill="#161b22" stroke="#30363d"/>
          <rect x="8" y="10" width="6" height="35" fill="#238636" opacity="0.8"/>
          <rect x="20" y="10" width="6" height="35" fill="#238636" opacity="0.55"/>
          <rect x="32" y="10" width="6" height="35" fill="#238636" opacity="0.35"/>
          <rect x="44" y="10" width="6" height="35" fill="#1f6feb" opacity="0.6"/>
        </g>
        <g transform="translate(780,90)">
          <rect x="0" y="0" width="36" height="36" rx="3" fill="#1a3d2a" stroke="#238636" opacity="0.8"/>
          <rect x="44" y="0" width="36" height="36" rx="3" fill="#1a2d4a" stroke="#1f6feb" opacity="0.8"/>
          <rect x="88" y="0" width="36" height="36" rx="3" fill="#2d1a4a" stroke="#8957e5" opacity="0.8"/>
        </g>
        <text x="480" y="225" text-anchor="middle" fill="#8b949e" font-size="12" font-family="system-ui,sans-serif">Space → Satellite → Downlink → Ground station → Processing → L1/L2 products</text>
      </svg>
    </div>
  </div>
  <div class="pipeline-scroll-spacer" id="pipeline-scroll-spacer"></div>
</section>
