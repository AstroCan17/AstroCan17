<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; color: #24292f; }
    img { max-width: 100%; height: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d0d7de; padding: 0.5rem 0.75rem; }
    details { margin: 1rem 0; padding: 0.5rem 1rem; border: 1px solid #d0d7de; border-radius: 6px; }
    summary { cursor: pointer; font-weight: 600; }
    blockquote { border-left: 4px solid #d0d7de; margin-left: 0; padding-left: 1rem; color: #57606a; }
    a { color: #0969da; }
    hr { border: 0; border-top: 1px solid #d0d7de; margin: 2rem 0; }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
