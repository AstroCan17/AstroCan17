<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      background: #0d1117;
      color: #e6edf3;
    }
    p, li, blockquote, td {
      text-align: justify;
      text-justify: inter-word;
    }
    h1, h2, h3, h4, h5, h6, summary, th {
      text-align: left;
    }
    img { max-width: 100%; height: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #30363d; padding: 0.5rem 0.75rem; }
    th { background: #161b22; }
    details {
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
    }
    summary { cursor: pointer; font-weight: 600; color: #e6edf3; }
    blockquote {
      border-left: 4px solid #30363d;
      margin-left: 0;
      padding-left: 1rem;
      color: #8b949e;
    }
    a { color: #58a6ff; }
    a:visited { color: #a371f7; }
    hr { border: 0; border-top: 1px solid #30363d; margin: 2rem 0; }
    code {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
